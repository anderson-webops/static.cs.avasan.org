name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false

      - name: Install Git LFS hooks
        run: git lfs install

      - name: Validate shell syntax
        run: bash -n scripts/*.sh

      - name: Test release provenance contract
        run: ./scripts/test-release-contract.sh

      - name: Verify LFS checkout
        run: ./scripts/verify-lfs-checkout.sh

      - name: Verify curated asset contract
        run: ./scripts/verify-required-assets.sh

      - name: Verify reproducible asset manifest
        run: |
          ./scripts/build-asset-manifest.sh
          git diff --exit-code -- asset-manifest.sha256

      - name: Verify and stage exact tagged release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch --force --no-tags origin main:refs/remotes/origin/main
          expected_version="${GITHUB_REF_NAME#v}"
          expected_revision="$(git rev-parse HEAD)"
          test "$(git rev-parse 'refs/remotes/origin/main^{commit}')" = \
            "${expected_revision}"
          ./scripts/verify-release-source.sh \
            "${expected_version}" "${expected_revision}"
          release_root="$(mktemp -d "${RUNNER_TEMP}/static-cs-release.XXXXXX")"
          ./scripts/prepare-release.sh \
            --release-root "${release_root}" \
            --expected-version "${expected_version}" \
            --expected-revision "${expected_revision}"
          test "$(readlink "${release_root}/current")" = \
            "releases/${expected_revision}"
