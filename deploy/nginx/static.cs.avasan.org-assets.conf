# Include this file inside the existing HTTPS `server` block for
# static.cs.avasan.org. The surrounding virtual host remains responsible for
# listen directives, TLS certificates, and the HTTP-to-HTTPS redirect.

root /var/www/static.cs.avasan.org/current;

autoindex off;
etag on;
if_modified_since exact;
sendfile on;
tcp_nopush on;

# Nginx's static-file module honors single byte-range requests by default.
# Keep one range enabled so video seeking and the IDE archive download work,
# while avoiding multipart-range amplification.
max_ranges 1;

# Replace inherited MIME mappings with the complete public payload contract.
types {
    application/zip zip;
    image/gif gif;
    video/mp4 mp4;
    text/plain txt;
}
default_type application/octet-stream;

# Do not expose Git metadata or any other dotfile if the deployment root ever
# contains more than the curated payload.
location ~ (^|/)\. {
    add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    return 404;
}

location = /robots.txt {
    default_type text/plain;

    limit_except GET HEAD {
        deny all;
    }

    try_files /robots.txt =404;

    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
}

# Only root-level filenames in the curated binary contract are public. The
# anchored expression prevents traversal into repository or release metadata.
location ~ ^/[A-Za-z0-9][A-Za-z0-9._-]*\.(?:gif|mp4|zip)$ {
    limit_except GET HEAD {
        deny all;
    }

    try_files $uri =404;

    gzip off;

    add_header Access-Control-Allow-Origin "https://cs.avasan.org" always;
    add_header Access-Control-Expose-Headers "Accept-Ranges, Content-Length, Content-Range, ETag" always;
    add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400" always;
    add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Vary "Origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
}

# Directory indexes, repository documents, manifests, and unknown paths are
# intentionally not part of the public static-host contract.
location / {
    add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    return 404;
}
